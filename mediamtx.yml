udpMaxPayloadSize: 1200

paths:
  cam1:
    runOnInit: >
      ffmpeg -f v4l2 -input_format yuyv422 -video_size 640x480 -framerate 30
      -i /dev/v4l/by-path/pci-0000:08:00.3-usb-0:1:1.3-video-index0
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam1
    runOnInitRestart: yes

  cam2:
    runOnInit: >
      ffmpeg -f v4l2 -input_format yuyv422 -video_size 640x480 -framerate 30
      -i /dev/v4l/by-path/pci-0000:23:00.3-usb-0:2:1.3-video-index0
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam2
    runOnInitRestart: yes

